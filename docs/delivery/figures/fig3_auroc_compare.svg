    <text style="fill: #666666; font: 6.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(18.679961 194.631284)">Same dataset, different training-data scale — shown for reference, not a like-for-like comparison.</text>
