   <g id="text_20">
    <text style="fill: #666666; font: 6.5px 'Arial', 'Helvetica', 'DejaVu Sans', sans-serif" transform="translate(23.763164 180.074127)">Protocols are not equivalent: papers train on the full official normal-image set (200+ images);</text>
